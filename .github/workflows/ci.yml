name: CI
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift build
      - run: swift test
      - name: Smoke test headless render
        run: .build/debug/doom-swift render --testwad --tics 35 --out /tmp/f.ppm
      - name: Compile a mod at runtime
        run: .build/debug/doom-swift modcheck Examples/hello_mod.swift
